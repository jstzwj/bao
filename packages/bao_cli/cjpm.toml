[package]
cjc-version = "1.0.0"
name = "bao_cli"
organization = "bao"
description = "Bao CLI entry point: run, build, install, test, init commands"
version = "0.1.0"
compile-option = ""
override-compile-option = ""
link-option = "target/native/jsc_bridge.o target/native/bao_cli_native_shims.o target/native/sanitizer_stubs.o target/native/bao_native_stubs.o target/native/bao_ssl_macros.o -lssl -lcrypto -luv -lz -lbrotlienc -lbrotlidec -lzstd -lpthread -ldl -lrt -lstdc++ /usr/lib/x86_64-linux-gnu/libatomic.so.1"
output-type = "executable"
src-dir = "src_min"
target-dir = ""

[dependencies]
bao_io = { path = "../bao_io" }
bao_collections = { path = "../bao_collections" }
bao_core = { path = "../bao_core" }
bao_path = { path = "../bao_path" }
bao_sys = { path = "../bao_sys" }

[native_sources]
bao_cli_native_shims = [
  "native/bao_cli_native_shims.c",
]

jsc_bridge = [
  "native/jsc_bridge.c",
]

sanitizer_stubs = [
  "native/sanitizer_stubs.c",
]
